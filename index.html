<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>ポメラニアン1位発表</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  width:1280px;
  height:720px;

  overflow:hidden;

  position:relative;

  font-family:'Panda',sans-serif;

  background:#f7e7c9;
}

/* 背景 */

.bg{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0.14;

  z-index:-3;
}

/* 全体 */

.container{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding-top:26px;
}

/* ロゴ */

.logo{

  width:300px;

  margin-bottom:18px;

  filter:
    drop-shadow(0 5px 10px rgba(255,255,255,0.9));
}

/* 白カード */

.card{

  width:1040px;

  height:540px;

  background:
    rgba(255,255,255,0.93);

  border-radius:42px;

  border:
    6px solid #f3a8bb;

  display:flex;

  flex-direction:column;

  align-items:center;

  position:relative;

  padding-top:36px;

  overflow:hidden;
}

/* タイトル */

.title{

  text-align:center;

  line-height:1.02;

  color:#6f5447;

  font-size:52px;

  text-shadow:
    0 3px 0 #fff;
}

/* ポメラニアン */

.pome{

  display:block;

  font-size:78px;

  margin-bottom:2px;

  color:#ff6f97;

  text-shadow:
    0 4px 0 rgba(255,255,255,0.95),
    0 8px 18px rgba(255,120,160,0.14);
}

/* 線 */

.line{

  width:82%;

  height:3px;

  margin:
    22px
    0;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      90deg,
      #f3a8bb 0px,
      #f3a8bb 12px,
      transparent 12px,
      transparent 24px
    );
}

/* 名前 */

.name{

  display:flex;

  align-items:flex-end;

  justify-content:center;

  width:100%;

  opacity:0;

  transform:
    translateY(16px);

  transition:
    all 0.8s ease;
}

.name.show{

  opacity:1;

  transform:
    translateY(0);
}

/* 犬上リオ */

.nameText{

  font-size:92px;

  line-height:1;

  color:#ff5f88;

  text-shadow:
    0 4px 0 rgba(255,255,255,0.95),
    0 8px 18px rgba(255,105,150,0.18);

  white-space:nowrap;
}

/* さんでした */

.san{

  font-size:52px;

  line-height:1;

  margin-left:0px;

  margin-bottom:8px;

  color:#6f5447;

  text-shadow:
    0 3px 0 #fff;

  white-space:nowrap;
}

/* プレゼント */

.present{

  margin-top:4px;

  opacity:0;

  transform:
    translateY(12px);

  transition:
    all 0.8s ease;
}

.present.show{

  opacity:1;

  transform:
    translateY(0);
}

.presentText{

  font-size:42px;

  color:#6f5447;

  text-shadow:
    0 3px 0 #fff;
}

.presentPink{

  color:#ff5f88;
}

/* 下 */

.footer{

  position:absolute;

  bottom:24px;

  left:50%;

  transform:translateX(-50%);

  font-size:26px;

  color:#9a7b68;

  opacity:0.9;
}

</style>
</head>

<body>

<img src="haikei.png" class="bg">

<div class="container">

  <!-- ロゴ -->

  <img src="wan_logo.png" class="logo">

  <!-- 白カード -->

  <div class="card">

    <!-- タイトル -->

    <div class="title">

      <span class="pome">
        ポメラニアン
      </span>

      に1番投票してくれたお客様は…

    </div>

    <div class="line"></div>

    <!-- 名前 -->

    <div class="name" id="name">

      <span class="nameText">
        犬上リオ
      </span>

      <span class="san">
        さんでした！
      </span>

    </div>

    <div class="line"></div>

    <!-- プレゼント -->

    <div class="present" id="present">

      <span class="presentText">
        後日
      </span>

      <span class="presentText presentPink">
        特別なプレゼント
      </span>

      <span class="presentText">
        を贈呈します！
      </span>

    </div>

    <!-- 下 -->

    <div class="footer">
      たくさんのご投票ありがとうございました！
    </div>

  </div>

</div>

<script>

/* 名前表示 */

setTimeout(()=>{

  document
    .getElementById('name')
    .classList.add('show');

},2200);

/* プレゼント表示 */

setTimeout(()=>{

  document
    .getElementById('present')
    .classList.add('show');

},4300);

</script>

</body>
</html>
