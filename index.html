<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>ポメラニアン発表</title>

<style>

@font-face{
    font-family:'Panda';
    src:url('pandabakery.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:1280px;
    height:720px;

    overflow:hidden;

    position:relative;

    font-family:'Panda',sans-serif;

    background:#fff3dc;
}

/* 背景 */

.bg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:1;

    z-index:-2;
}

/* キラキラ */

.sparkle{

    position:absolute;

    opacity:0.75;

    animation:
    sparkle 3s infinite ease-in-out;
}

.star{

    width:22px;
    height:22px;

    background:#fff0a8;

    clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
    );

    box-shadow:
    0 0 16px rgba(255,220,100,0.55);
}

.diamond{

    width:18px;
    height:18px;

    background:#fff0a8;

    transform:rotate(45deg);

    box-shadow:
    0 0 16px rgba(255,220,100,0.55);
}

.s1{
    top:110px;
    left:150px;
}

.s2{
    top:180px;
    right:210px;

    animation-delay:1s;
}

.s3{
    bottom:130px;
    right:260px;

    animation-delay:2s;
}

/* 全体 */

.container{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:22px;
}

/* ロゴ */

.logo{

    width:300px;

    margin-bottom:18px;

    z-index:10;

    filter:
    drop-shadow(0 10px 24px rgba(0,0,0,0.10));
}

/* カード */

.card{

    width:1020px;

    height:430px;

    background:
    rgba(255,255,255,0.90);

    border:
    6px solid #f6b7c9;

    border-radius:42px;

    box-shadow:
    0 20px 50px rgba(255,190,60,0.10);

    display:flex;

    flex-direction:column;

    align-items:center;

    position:relative;

    padding-top:30px;

    overflow:hidden;
}

/* タイトル */

.title{

    text-align:center;

    line-height:1.02;

    color:#7b4b35;

    font-size:46px;

    text-shadow:
    0 3px 0 #fff;
}

/* ポメラニアン */

.pome{

    display:block;

    font-size:72px;

    margin-bottom:4px;

    color:#ffadc3;

    text-shadow:
    0 4px 0 #fff,
    0 0 10px rgba(255,220,120,0.14);
}

/* 線 */

.line{

    width:82%;

    height:3px;

    margin:
    18px
    0;

    border-radius:999px;

    background:
    repeating-linear-gradient(
        90deg,
        #ffd76c 0px,
        #ffd76c 12px,
        transparent 12px,
        transparent 24px
    );
}

/* 名前 */

.name{

    display:flex;

    align-items:flex-end;

    justify-content:center;

    width:100%;

    opacity:0;

    transform:
    translateY(14px);

    transition:
    all 0.8s ease;
}

.name.show{

    opacity:1;

    transform:
    translateY(0);
}

/* 犬上リオ */

.nameText{

    font-size:88px;

    line-height:1;

    color:#ff5d74;

    text-shadow:
    0 4px 0 #fff,
    0 0 10px rgba(255,180,180,0.20),
    0 8px 16px rgba(255,90,120,0.12);

    white-space:nowrap;
}

/* さんでした */

.san{

    font-size:48px;

    line-height:1;

    margin-bottom:8px;

    color:#7b4b35;

    text-shadow:
    0 3px 0 #fff;

    white-space:nowrap;
}

/* プレゼント */

.present{

    margin-top:2px;

    opacity:0;

    transform:
    translateY(12px);

    transition:
    all 0.8s ease;
}

.present.show{

    opacity:1;

    transform:
    translateY(0);
}

.presentText{

    font-size:40px;

    color:#7b4b35;

    text-shadow:
    0 3px 0 #fff;
}

/* 特別なプレゼント */

.presentPink{

    color:#ffadc3;

    text-shadow:
    0 3px 0 #fff,
    0 0 8px rgba(255,220,120,0.12);
}

/* 下 */

.footer{

    position:absolute;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    font-size:24px;

    color:#9a7b68;

    opacity:0.95;
}

/* アニメ */

@keyframes sparkle{

    0%{
        transform:
        scale(0.7);

        opacity:0.35;
    }

    50%{
        transform:
        scale(1.3);

        opacity:1;
    }

    100%{
        transform:
        scale(0.7);

        opacity:0.35;
    }
}

</style>
</head>

<body>

<!-- 背景 -->

<img
src="haikei.png"
class="bg"
>

<!-- キラキラ -->

<div class="sparkle star s1"></div>
<div class="sparkle diamond s2"></div>
<div class="sparkle star s3"></div>

<div class="container">

    <!-- ロゴ -->

    <img
    src="wan_logo.png"
    class="logo"
    >

    <!-- カード -->

    <div class="card">

        <!-- タイトル -->

        <div class="title">

            <span class="pome">
                ポメラニアン
            </span>

            に1番投票してくれたお客様は…

        </div>

        <div class="line"></div>

        <!-- 名前 -->

        <div class="name" id="name">

            <span class="nameText">
                犬上リオ
            </span>

            <span class="san">
                さんでした！
            </span>

        </div>

        <div class="line"></div>

        <!-- プレゼント -->

        <div class="present" id="present">

            <span class="presentText">
                後日
            </span>

            <span class="presentText presentPink">
                特別なプレゼント
            </span>

            <span class="presentText">
                を贈呈します！
            </span>

        </div>

        <!-- 下 -->

        <div class="footer">
            たくさんのご投票ありがとうございました！
        </div>

    </div>

</div>

<script>

/* 名前表示 */

setTimeout(()=>{

    document
    .getElementById('name')
    .classList.add('show');

},2200);

/* プレゼント表示 */

setTimeout(()=>{

    document
    .getElementById('present')
    .classList.add('show');

},4300);

</script>

</body>
</html>
