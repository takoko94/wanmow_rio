<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>ポメラニアン1位発表</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  width:1280px;
  height:720px;

  overflow:hidden;

  position:relative;

  font-family:'Panda',sans-serif;

  background:#f7e7c9;
}

/* 背景 */

.bg{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0.18;

  z-index:-5;
}

.overlay{

  position:absolute;

  inset:0;

  background:
    rgba(255,250,245,0.22);

  z-index:-4;
}

/* 外枠 */

.frame{

  position:absolute;

  inset:12px;

  border-radius:34px;

  border:
    3px dashed #ef9eb5;
}

/* 肉球 */

.paw{

  position:absolute;

  opacity:0.85;
}

.paw1{
  left:58px;
  top:90px;
  font-size:70px;
  color:#ff96b3;
}

.paw2{
  right:70px;
  top:290px;
  font-size:72px;
  color:#f5bf59;
}

.paw3{
  left:55px;
  bottom:90px;
  font-size:74px;
  color:#86d9ba;
}

/* キラキラ */

.star{

  position:absolute;

  font-size:42px;

  opacity:0.9;
}

.star1{
  left:260px;
  top:120px;
  color:#ffd863;
}

.star2{
  right:220px;
  top:140px;
  color:#ff9fbc;
}

.star3{
  right:170px;
  bottom:110px;
  color:#8ddfcf;
}

/* 全体 */

.container{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding-top:22px;
}

/* ロゴ */

.logo{

  width:330px;

  margin-bottom:16px;

  filter:
    drop-shadow(0 6px 12px rgba(255,255,255,0.95));
}

/* カード */

.card{

  width:1080px;

  height:520px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.97),
      rgba(255,255,255,0.93)
    );

  border-radius:44px;

  border:
    6px solid #f3a8bb;

  position:relative;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding-top:28px;

  box-shadow:
    0 10px 28px rgba(0,0,0,0.08);
}

/* タイトル */

.title{

  text-align:center;

  line-height:1.18;

  color:#6f5447;

  font-size:54px;

  text-shadow:
    0 4px 0 #fff;
}

/* ポメ */

.pome{

  display:block;

  font-size:92px;

  margin-bottom:6px;

  background:
    linear-gradient(
      180deg,
      #ffb3c7 0%,
      #ff6b97 52%,
      #ff4d84 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(0 0 2px #fff)
    drop-shadow(0 4px 0 rgba(255,255,255,0.9));
}

/* 線 */

.line{

  width:86%;

  height:4px;

  margin:
    26px
    0
    20px;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      90deg,
      #f3a8bb 0px,
      #f3a8bb 12px,
      transparent 12px,
      transparent 24px
    );

  position:relative;
}

.line::after{

  content:'🐾';

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  font-size:24px;

  background:white;

  padding:0 12px;
}

/* 名前 */

.name{

  display:flex;

  align-items:flex-end;

  justify-content:center;

  flex-wrap:wrap;

  width:100%;

  gap:0px;

  opacity:0;

  transform:
    translateY(20px)
    scale(0.95);

  transition:
    all 0.8s ease;
}

.name.show{

  opacity:1;

  transform:
    translateY(0)
    scale(1);
}

/* 犬上リオ */

.nameText{

  font-size:118px;

  line-height:1;

  background:
    linear-gradient(
      180deg,
      #ffb8ca 0%,
      #ff6f99 48%,
      #ff4f86 100%
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  filter:
    drop-shadow(0 0 2px #fff)
    drop-shadow(0 6px 0 rgba(255,255,255,0.92))
    drop-shadow(0 10px 20px rgba(255,105,150,0.25));

  white-space:nowrap;
}

/* さんでした */

.san{

  font-size:60px;

  line-height:1.2;

  margin-left:-4px;

  margin-bottom:10px;

  color:#6f5447;

  text-shadow:
    0 4px 0 #fff;
}

/* プレゼント */

.present{

  margin-top:30px;

  opacity:0;

  transform:
    translateY(18px);

  transition:
    all 0.8s ease;
}

.present.show{

  opacity:1;

  transform:
    translateY(0);
}

.presentText{

  font-size:52px;

  color:#6f5447;

  text-shadow:
    0 4px 0 #fff;
}

.presentPink{

  color:#ff5d8f;
}

/* 下帯 */

.footer{

  position:absolute;

  bottom:16px;

  left:50%;

  transform:translateX(-50%);

  width:620px;

  height:58px;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #ff9fba,
      #ff7fa6
    );

  display:flex;

  align-items:center;

  justify-content:center;

  color:white;

  font-size:34px;

  box-shadow:
    0 6px 14px rgba(255,120,160,0.25);
}

</style>
</head>

<body>

<img src="haikei.png" class="bg">

<div class="overlay"></div>

<div class="frame"></div>

<div class="paw paw1">🐾</div>
<div class="paw paw2">🐾</div>
<div class="paw paw3">🐾</div>

<div class="star star1">✦</div>
<div class="star star2">✦</div>
<div class="star star3">✦</div>

<div class="container">

  <!-- ロゴ -->

  <img src="wan_logo.png" class="logo">

  <!-- カード -->

  <div class="card">

    <div class="title">

      <span class="pome">
        ポメラニアン
      </span>

      に1番投票してくれた<br>
      お客様は…

    </div>

    <div class="line"></div>

    <!-- 名前 -->

    <div class="name" id="name">

      <span class="nameText">
        犬上リオ
      </span>

      <span class="san">
        さんでした！
      </span>

    </div>

    <div class="line"></div>

    <!-- プレゼント -->

    <div class="present" id="present">

      <span class="presentText">
        後日
      </span>

      <span class="presentText presentPink">
        特別なプレゼント
      </span>

      <span class="presentText">
        を贈呈します！
      </span>

    </div>

    <!-- 下帯 -->

    <div class="footer">
      🐾 たくさんのご投票ありがとうございました！ 🐾
    </div>

  </div>

</div>

<script>

/* 名前表示 */

setTimeout(()=>{

  document
    .getElementById('name')
    .classList.add('show');

},2200);

/* プレゼント表示 */

setTimeout(()=>{

  document
    .getElementById('present')
    .classList.add('show');

},4300);

</script>

</body>
</html>
