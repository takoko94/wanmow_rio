<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>ポメラニアン1位発表</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  width:1280px;
  height:720px;

  overflow:hidden;

  position:relative;

  font-family:'Panda',sans-serif;

  background:#f7e7c9;
}

/* 背景 */

.bg{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0.14;

  z-index:-5;
}

.overlay{

  position:absolute;

  inset:0;

  background:
    rgba(255,250,245,0.22);

  z-index:-4;
}

/* 外枠 */

.frame{

  position:absolute;

  inset:12px;

  border-radius:34px;

  border:
    3px dashed #ef9eb5;
}

/* キラキラ */

.star{

  position:absolute;

  font-size:34px;

  opacity:0.65;
}

.star1{
  left:180px;
  top:140px;
  color:#ffd863;
}

.star2{
  right:200px;
  top:170px;
  color:#ff9fbc;
}

.star3{
  right:240px;
  bottom:150px;
  color:#8ddfcf;
}

/* 全体 */

.container{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding-top:24px;
}

/* ロゴ */

.logo{

  width:320px;

  margin-bottom:18px;

  filter:
    drop-shadow(0 5px 10px rgba(255,255,255,0.95));
}

/* カード */

.card{

  width:1040px;

  height:500px;

  background:
    rgba(255,255,255,0.92);

  border-radius:42px;

  border:
    6px solid #f3a8bb;

  position:relative;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding-top:34px;

  box-shadow:
    0 10px 24px rgba(0,0,0,0.08);
}

/* タイトル */

.title{

  text-align:center;

  line-height:1.15;

  color:#6f5447;

  font-size:52px;

  text-shadow:
    0 3px 0 #fff;
}

/* ポメラニアン */

.pome{

  display:block;

  font-size:82px;

  margin-bottom:8px;

  color:#ff6f97;

  text-shadow:
    0 4px 0 rgba(255,255,255,0.95),
    0 8px 18px rgba(255,120,160,0.18);
}

/* 線 */

.line{

  width:84%;

  height:3px;

  margin:
    24px
    0;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      90deg,
      #f3a8bb 0px,
      #f3a8bb 12px,
      transparent 12px,
      transparent 24px
    );
}

/* 名前 */

.name{

  display:flex;

  align-items:flex-end;

  justify-content:center;

  width:100%;

  opacity:0;

  transform:
    translateY(16px);

  transition:
    all 0.8s ease;
}

.name.show{

  opacity:1;

  transform:
    translateY(0);
}

/* 犬上リオ */

.nameText{

  font-size:102px;

  line-height:1;

  color:#ff5f88;

  text-shadow:
    0 4px 0 rgba(255,255,255,0.95),
    0 8px 18px rgba(255,105,150,0.18);

  white-space:nowrap;
}

/* さんでした */

.san{

  font-size:54px;

  line-height:1.1;

  margin-left:0px;

  margin-bottom:10px;

  color:#6f5447;

  text-shadow:
    0 3px 0 #fff;

  white-space:nowrap;
}

/* プレゼント */

.present{

  margin-top:12px;

  opacity:0;

  transform:
    translateY(12px);

  transition:
    all 0.8s ease;
}

.present.show{

  opacity:1;

  transform:
    translateY(0);
}

.presentText{

  font-size:44px;

  color:#6f5447;

  text-shadow:
    0 3px 0 #fff;
}

.presentPink{

  color:#ff5f88;
}

/* 下 */

.footer{

  position:absolute;

  bottom:20px;

  left:50%;

  transform:translateX(-50%);

  font-size:28px;

  color:#9a7b68;

  opacity:0.9;
}

</style>
</head>

<body>

<img src="haikei.png" class="bg">

<div class="overlay"></div>

<div class="frame"></div>

<div class="star star1">✦</div>
<div class="star star2">✦</div>
<div class="star star3">✦</div>

<div class="container">

  <!-- ロゴ -->

  <img src="wan_logo.png" class="logo">

  <!-- カード -->

  <div class="card">

    <div class="title">

      <span class="pome">
        ポメラニアン
      </span>

      に1番投票してくれた<br>
      お客様は…

    </div>

    <div class="line"></div>

    <!-- 名前 -->

    <div class="name" id="name">

      <span class="nameText">
        犬上リオ
      </span>

      <span class="san">
        さんでした！
      </span>

    </div>

    <div class="line"></div>

    <!-- プレゼント -->

    <div class="present" id="present">

      <span class="presentText">
        後日
      </span>

      <span class="presentText presentPink">
        特別なプレゼント
      </span>

      <span class="presentText">
        を贈呈します！
      </span>

    </div>

    <!-- 下 -->

    <div class="footer">
      たくさんのご投票ありがとうございました！
    </div>

  </div>

</div>

<script>

/* 名前表示 */

setTimeout(()=>{

  document
    .getElementById('name')
    .classList.add('show');

},2200);

/* プレゼント表示 */

setTimeout(()=>{

  document
    .getElementById('present')
    .classList.add('show');

},4300);

</script>

</body>
</html>
